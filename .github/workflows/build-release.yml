name: Build and Release IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0. Leave empty for build only.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Run shell tests
        run: |
          chmod +x build-ipk.sh files/usr/libexec/bandwidth-control/check tests/*.sh
          for test in tests/*.sh; do sh "$test"; done

      - name: Build IPK
        run: ./build-ipk.sh

      - name: Create checksums
        run: |
          cd dist
          sha256sum bandwidth-control_*.ipk > SHA256SUMS

      - name: Select release tag
        id: release_tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          [ "$REF_TYPE" = tag ] && tag="$REF_NAME"
          [ -n "$INPUT_TAG" ] && tag="$INPUT_TAG"
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-control-ipk
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.release_tag.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: Bandwidth Control ${{ steps.release_tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/bandwidth-control_*.ipk
            dist/SHA256SUMS

      - name: Release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Bandwidth Control IPK

          - Install: `opkg install /tmp/bandwidth-control_*.ipk`
          - Dependency: `nlbwmon` must match target OpenWrt release and architecture.
          - LuCI: **Services → Bandwidth Control**
          EOF
