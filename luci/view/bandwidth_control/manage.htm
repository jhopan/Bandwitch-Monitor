<div class="cbi-section">
 <h3><%:Audit log%></h3>
 <pre style="max-height:14em;overflow:auto"><%=pcdata(luci.sys.exec('/usr/libexec/bandwidth-control/check audit 50 2>/dev/null'))%></pre>
 <h3><%:Backup and restore%></h3>
 <p><a class="cbi-button cbi-button-action" href="<%=url('admin/services/bandwidth-control/backup')%>"><%:Download backup%></a></p>
 <p>
  <input type="file" name="archive" accept=".tar.gz,application/gzip" />
  <input class="cbi-button cbi-button-apply" type="submit" value="<%:Restore backup%>" formaction="<%=url('admin/services/bandwidth-control/restore')%>" formmethod="post" formenctype="multipart/form-data" formnovalidate="formnovalidate" />
 </p>
 <p><em><%:Choose a backup file only before clicking Restore backup. Other page buttons will not require a file.%></em></p>
</div>
