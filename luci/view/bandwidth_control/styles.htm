<style>
/* LuCI CBI table: keep all device controls usable instead of wrapping into overlap. */
.cbi-section-table { display:block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cbi-section-table table { min-width: 1280px; }
.cbi-section-table th, .cbi-section-table td { white-space: normal; vertical-align: middle; padding: .45rem .55rem; }
.cbi-section-table input[type="text"], .cbi-section-table select { min-width: 7rem; max-width: 12rem; }
.cbi-section-table .cbi-button { margin: .12rem; }
.cbi-section-table td:last-child { position: sticky; right: 0; background: var(--background-color-high, #fff); box-shadow: -3px 0 6px rgba(0,0,0,.08); }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(1) { min-width: 8rem; }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(2) { width: 5.5rem; text-align:center; }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(3) { min-width: 15rem; }
/* Replacement selector is absent until one row enters Edit MAC mode. */
#cbi-bandwidth-control-device .bc-mac-edit-select { display:none; min-width:15rem; }
#cbi-bandwidth-control-device .bc-mac-edit-active { display:table-cell; }
#cbi-bandwidth-control-device:not(:has(.bc-mac-edit-active)) th:nth-child(4) { display:none; }
#cbi-bandwidth-control-device:not(:has(.bc-mac-edit-active)) .cbi-section-table-row > :nth-child(4) { display:none; }
.bc-mac-edit-select small { display:block; margin-top:.3rem; color:#6b7280; font-size:.8em; }
.bc-hint { color:#6b7280; font-size:.9em; }
.bc-device-tabs { display:flex; gap:1.25rem; margin:.25rem 0 1rem; border-bottom:1px solid #d1d5db; }
.bc-device-tabs button { appearance:none; border:0; background:transparent; color:#6b7280; padding:.55rem .15rem; margin:0; border-bottom:2px solid transparent; font-weight:500; cursor:pointer; }
.bc-device-tabs button.active { color:#111827; border-bottom-color:#111827; font-weight:700; }
@media (max-width: 900px) {
 .cbi-section-table { border:1px solid #d1d5db; border-radius:.35rem; }
 .cbi-section-table th, .cbi-section-table td { padding:.35rem; }
 .cbi-section-table input[type="text"], .cbi-section-table select { min-width: 8rem; max-width: 10rem; }
}
</style>
<nav class="bc-device-tabs" aria-label="Bandwidth Control sections">
 <button type="button" data-bc-page="dashboard" class="active">Dashboard</button>
 <button type="button" data-bc-page="devices">Devices &amp; Groups</button>
 <button type="button" data-bc-page="logs">Logs &amp; Backup</button>
</nav>
<div class="bc-hint">Usage refreshes every 30 seconds when no form field is being edited.</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var dirty = false;
  var form = document.querySelector('form');
  var tabs = document.querySelectorAll('.bc-device-tabs button');
  var device = document.querySelector('#cbi-bandwidth-control-device');
  var groups = document.querySelector('#cbi-bandwidth-control-group');
  var main = document.querySelector('#cbi-bandwidth-control-main');
  var sections = document.querySelectorAll('.cbi-section');
  var logSections = [];
  var dashboardSections = [];
  sections.forEach(function(section) {
    var text = section.textContent || '';
    if (section === device || section === groups || section === main) return;
    if (/Audit log|Backup and restore/.test(text)) logSections.push(section);
    else if (/Dashboard/.test(text)) dashboardSections.push(section);
  });
  function visible(list, show) { list.forEach(function(node) { node.style.display = show ? '' : 'none'; }); }
  function setPage(name) {
    visible([main].filter(Boolean), name === 'dashboard');
    visible(dashboardSections, name === 'dashboard');
    visible([device, groups].filter(Boolean), name === 'devices');
    visible(logSections, name === 'logs');
    tabs.forEach(function(tab) { tab.classList.toggle('active', tab.dataset.bcPage === name); });
  }
  tabs.forEach(function(tab) { tab.addEventListener('click', function() { setPage(tab.dataset.bcPage); }); });
  setPage('dashboard');
  if (form) {
    form.addEventListener('input', function () { dirty = true; });
    form.addEventListener('change', function () { dirty = true; });
    form.addEventListener('submit', function () { dirty = true; });
  }
  var statusUrl = window.location.pathname.replace(/\/$/, '') + '/status';
  function fmt(bytes) {
    if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
    return Math.round(bytes / 1024) + ' KB';
  }
  function poll() {
    if (dirty) return setTimeout(poll, 30000);
    fetch(statusUrl, { credentials: 'same-origin' })
      .then(function(res) { if (!res.ok) throw new Error('status'); return res.json(); })
      .then(function(data) {
        (data.devices || []).forEach(function(d) {
          document.querySelectorAll('.bc-live-value[data-bc-mac="' + d.mac + '"]').forEach(function(node) {
            if (node.dataset.bcField === 'last') node.textContent = d.last_seen || 'Never';
            else if (node.dataset.bcField === 'used') {
              var quotaInput = node.closest('tr').querySelector('input[name$=".quota_gb"]');
              var quota = quotaInput ? quotaInput.value.replace(',', '.') : '0';
              node.textContent = fmt(d.used) + ' / ' + quota + ' GB';
            } else if (node.dataset.bcField === 'details') node.textContent = fmt(d.download) + ' / ' + fmt(d.upload);
            else if (node.dataset.bcField === 'status') node.textContent = d.state === 'blocked' ? 'Blocked: ' + d.reason : 'Allowed';
          });
        });
      })
      .catch(function() {})
      .then(function() { setTimeout(poll, 30000); });
  }
  setTimeout(poll, 30000);
});
</script>
