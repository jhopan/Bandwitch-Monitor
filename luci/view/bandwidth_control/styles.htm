<style>
/* LuCI CBI table: keep all device controls usable instead of wrapping into overlap. */
.cbi-section-table { display:block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cbi-section-table table { min-width: 1280px; }
.cbi-section-table th, .cbi-section-table td { white-space: normal; vertical-align: middle; padding: .45rem .55rem; }
.cbi-section-table input[type="text"], .cbi-section-table select { min-width: 7rem; max-width: 12rem; }
.cbi-section-table .cbi-button { margin: .12rem; }
.cbi-section-table td:last-child { position: sticky; right: 0; background: var(--background-color-high, #fff); box-shadow: -3px 0 6px rgba(0,0,0,.08); }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(1) { min-width: 8rem; }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(2) { width: 5.5rem; text-align:center; }
#cbi-bandwidth-control-device .cbi-section-table-row > :nth-child(3) { min-width: 15rem; }
/* Replacement selector is absent until one row enters Edit MAC mode. */
#cbi-bandwidth-control-device .bc-mac-edit-select { display:none; min-width:15rem; }
#cbi-bandwidth-control-device .bc-mac-edit-active { display:table-cell; }
#cbi-bandwidth-control-device:not(:has(.bc-mac-edit-active)) th:nth-child(4) { display:none; }
#cbi-bandwidth-control-device:not(:has(.bc-mac-edit-active)) .cbi-section-table-row > :nth-child(4) { display:none; }
.bc-mac-edit-select small { display:block; margin-top:.3rem; color:#6b7280; font-size:.8em; }
.bc-hint { color:#6b7280; font-size:.9em; }
@media (max-width: 900px) {
 .cbi-section-table { border:1px solid #d1d5db; border-radius:.35rem; }
 .cbi-section-table th, .cbi-section-table td { padding:.35rem; }
 .cbi-section-table input[type="text"], .cbi-section-table select { min-width: 8rem; max-width: 10rem; }
}
</style>
<div class="bc-hint">Device table is scrollable horizontally. On phone, swipe left/right to see all controls. Usage refreshes every 30 seconds when no form field is being edited.</div>
<script>
(function () {
  var dirty = false;
  var form = document.querySelector('form');
  if (form) {
    form.addEventListener('input', function () { dirty = true; });
    form.addEventListener('change', function () { dirty = true; });
    form.addEventListener('submit', function () { dirty = true; });
  }
  function refresh() {
    if (!dirty && !document.querySelector(':focus')) window.location.href = window.location.pathname;
    else setTimeout(refresh, 30000);
  }
  setTimeout(refresh, 30000);
}());
</script>
